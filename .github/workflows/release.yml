name: Release

# Either push a tag vX.Y.Z (creates a *draft* release to publish manually), or start this
# workflow from GitHub → Actions → Release → "Run workflow": it tags the current master with
# the project version and publishes the release directly (or as draft when unticked).
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Release sofort veröffentlichen (sonst Entwurf)'
        type: boolean
        default: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  release:
    runs-on: windows-latest
    env:
      HAS_PFX: ${{ secrets.DYNEX_SIGN_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress }
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { throw 'NSIS-Installation fehlgeschlagen.' }
          "${env:ProgramFiles(x86)}\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $project = [xml](Get-Content src/Dynex.Desktop/Dynex.Desktop.csproj)
          $projectVersion = @($project.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            if ('${{ github.ref_name }}' -ne 'master') { throw 'Manuelle Releases nur von master.' }
            $version = $projectVersion
            gh release view "v$version" *> $null
            if ($LASTEXITCODE -eq 0) { throw "Release v$version existiert bereits. Erst die Version erhöhen." }
            $global:LASTEXITCODE = 0
          } else {
            $version = '${{ github.ref_name }}'.TrimStart('v')
            if ($projectVersion -ne $version) { throw "Tag $version passt nicht zur Projektversion $projectVersion." }
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Ungültige Version: $version" }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Tests
        shell: pwsh
        run: |
          ./scripts/anticheat-guard.ps1
          foreach ($suite in 'Core','Update','Adaptive','SpeedTest','Runtime','Setup','UserCleanup','GameDetection','Bulk','Shaper') {
            dotnet run --project "tests/Dynex.$suite.Tests" -c Release
            if ($LASTEXITCODE -ne 0) { throw "$suite-Tests fehlgeschlagen." }
          }
      - name: Import signing certificate
        if: env.HAS_PFX == 'true'
        shell: pwsh
        env:
          PFX: ${{ secrets.DYNEX_SIGN_PFX_BASE64 }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'dynex-sign.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX))
          "DYNEX_SIGN_PFX=$path" >> $env:GITHUB_ENV
      - name: Build and sign
        shell: pwsh
        env:
          DYNEX_SIGN_PFX_PASSWORD: ${{ secrets.DYNEX_SIGN_PFX_PASSWORD }}
        run: |
          # Signed whenever the certificate secrets exist; until then an unsigned build
          # (Windows SmartScreen warns). Once a certificate is configured, signing is mandatory.
          if ($env:DYNEX_SIGN_PFX) {
            ./scripts/build.ps1 -Version ${{ steps.version.outputs.value }} -RequireSignature
          } else {
            Write-Warning 'Kein Signaturzertifikat hinterlegt: Release wird unsigniert gebaut.'
            ./scripts/build.ps1 -Version ${{ steps.version.outputs.value }}
          }
      - name: Remove certificate
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'dynex-sign.pfx') -ErrorAction SilentlyContinue
      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          $v = '${{ steps.version.outputs.value }}'
          $signed = if ($env:HAS_PFX -eq 'true') { 'Setup und Programme sind signiert.' } else { 'Diese Version ist noch nicht code-signiert; Windows SmartScreen kann beim Start des Setups warnen („Weitere Informationen“ → „Trotzdem ausführen“). Die SHA-256-Prüfsummen liegen bei.' }
          # Notes go through a file: quotes inside a native argument get split on Windows.
          # Single quotes only: PowerShell treats typographic quotes („ “) as string delimiters.
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -LiteralPath $notesFile -Encoding utf8 -Value ('Änderungen: siehe README, Abschnitt "Neu in ' + $v + '". ' + $signed)
          $assets = @("artifacts/DYNEX-Setup-$v.exe", "artifacts/DYNEX-Setup-$v.exe.sha256", "artifacts/DYNEX-Cleanup-$v.exe", "artifacts/DYNEX-Cleanup-$v.exe.sha256")
          # --target creates the tag on the tested commit when it does not exist yet (manual start).
          # @(...) keeps an array: splatting a plain string would pass it character by character.
          $mode = @(if ($env:PUBLISH -eq 'true') { '--latest' } else { '--draft' })
          gh release create "v$v" --target $env:GITHUB_SHA --title "DYNEX $v" --notes-file $notesFile @mode @assets
          if ($LASTEXITCODE -ne 0) { throw 'Release konnte nicht erstellt werden.' }
